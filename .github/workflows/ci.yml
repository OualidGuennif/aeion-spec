name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docs-gates:
    name: Knowledge, links and repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: ./tools/knowledge/knowledge-check
      - name: doc-links (with --diff on pull requests)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then ./tools/knowledge/doc-links --diff "origin/$BASE_REF"; else ./tools/knowledge/doc-links; fi
      - run: ./tools/repo-health/repo-health
      - run: ./tools/template-tests

  app-tests:
    # main's branch protection requires a check by exactly this name; a rename blocks every release merge.
    name: Application tests (Python, with the Flue harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # Exact pins, the versions the local suite passes with: an unpinned install takes whatever the index serves.
      - name: Set up Python .venv for OpenShell, Axiom03, and LiteLLM tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir fastapi==0.163.1 uvicorn==0.54.0 litellm==1.109.1 jsonschema==4.26.0 cryptography==50.0.2
      - name: Install JS workspace packages and build Next.js UI
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun --cwd packages/web build
      - name: Run Bun server unit/integration tests
        working-directory: app
        run: bun test packages/server/test
      - name: Run Python OpenShell & Axiom03 contract tests
        run: .venv/bin/python -m unittest discover -s app/tests -v

  secret-scan:
    runs-on: ubuntu-latest
    # On a pull request the action lists the PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google/osv-scanner-action/osv-scanner-action@98b584ee2ed2da3935ccce10e06739d54cdcd20b # v2.0.0
        with:
          scan-args: --recursive ./

  sast-scan:
    runs-on: ubuntu-latest
    container: semgrep/semgrep@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6 # 1.182.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep scan --config p/owasp-top-ten --error
# Keep action revisions pinned; review upstream changes before updating them.
